name: CI Health Check & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Health Check & Sintaksis Auditini ishga tushirish
        run: node scripts/health-check.js
