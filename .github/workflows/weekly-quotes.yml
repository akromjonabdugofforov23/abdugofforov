name: Weekly Quotes Auto-Updater

on:
  schedule:
    # Har dushanba soat 00:00 UTC (Toshkent vaqti bilan 05:00)da ishga tushadi
    - cron: '0 0 * * 1'
  workflow_dispatch: # Istalgan vaqtda GitHub Actions orqali qo'lda ham ishga tushirish mumkin

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest

    steps:
    - name: Repositoriyani yuklab olish
      uses: actions/checkout@v4

    - name: Node.js o'rnatish
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Haftalik hikmatlarni yangilash skriptini yurgizish
      run: node scripts/fetch-weekly-quotes.mjs

    - name: Loyihani qayta qurish (build)
      run: |
        npm ci
        npm run build

    - name: O'zgarishlarni GitHub ga saqlash va commit qilish
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/quotes.json dist/ scripts/
        if git diff --staged --quiet; then
          echo "Hech qanday o'zgarish yo'q, commit qilinmadi."
        else
          git commit -m "chore: yangi haftalik kun hikmatlari yangilandi [skip ci]"
          git push
        fi
